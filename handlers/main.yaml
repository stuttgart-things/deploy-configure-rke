---
- name: Update OS trust store (k3s root CA)
  ansible.builtin.command: "{{ 'update-ca-trust extract' if ansible_facts['os_family'] == 'RedHat' else 'update-ca-certificates' }}"
  changed_when: true

# Only with rke2_restart_on_config_change: true (otherwise the start step's
# restart_rke2_already_running restart applies, as before). One server at a
# time, and the next one only once this one is back -- a broken flag or
# authentication config stops the run on the first node instead of taking
# every control plane down.
#
# Not `throttle: 1` + `any_errors_fatal` on a per-host handler: that still
# runs the handler on every host, one after the other, and only aborts the
# play afterwards (it took all three infra-sthings apiservers down,
# stuttgart-things/stuttgart-things#4232). Instead one host walks the
# servers that changed and restarts them via delegate_to; the first failed
# include fails that host and ends the loop.
- name: Restart rke2-server
  ansible.builtin.include_tasks: restart-rke2-server.yaml
  loop: >-
    {{ ansible_play_hosts
       | map('extract', hostvars)
       | selectattr('_rke2_restart_pending', 'defined')
       | selectattr('_rke2_restart_pending')
       | map(attribute='inventory_hostname')
       | reject('in', groups['workers'] | default([]))
       | list }}
  loop_control:
    loop_var: _rke2_restart_host
  run_once: true
  when:
    - rke2_restart_on_config_change | bool
    - not install_k3s | bool
