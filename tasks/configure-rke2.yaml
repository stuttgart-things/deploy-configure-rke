---
- name: Create config dir
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    owner: "{{ rke2_user_name }}"
    group: "{{ rke2_user_group }}"
    mode: 0755
  tags: rke2_config

# Before config.yaml: the apiserver must find the file it is pointed at.
- name: Create kube-apiserver authentication config
  block:
    - name: Create authentication config dir
      ansible.builtin.file:
        path: "{{ rke2_authentication_config_dir }}"
        state: directory
        owner: "{{ rke2_user_name }}"
        group: "{{ rke2_user_group }}"
        mode: 0700

    - name: Create authentication config
      ansible.builtin.template:
        src: rke2-authentication-config.yaml.j2
        dest: "{{ rke2_authentication_config_dir }}/{{ rke2_authentication_config_file }}"
        owner: "{{ rke2_user_name }}"
        group: "{{ rke2_user_group }}"
        mode: 0600
      register: _rke2_authn_config_result
      notify: Restart rke2-server
  when:
    - rke2_authentication_config | length > 0
    - inventory_hostname not in groups['workers']
  tags: rke2_config

- name: Create rke2 config
  ansible.builtin.template:
    src: "{{ rke2_config }}"
    dest: "{{ rke2_config_dir }}/config.yaml"
  register: _rke2_config_result
  notify: Restart rke2-server
  tags: rke2_config

# Which hosts the "Restart rke2-server" handler walks (it runs once and
# delegates, so the notify alone does not tell it).
- name: Remember a pending rke2-server restart
  ansible.builtin.set_fact:
    _rke2_restart_pending: true
  when: (_rke2_authn_config_result is changed) or (_rke2_config_result is changed)
  tags: rke2_config

- name: Add proxy details in rke2-server service
  ansible.builtin.copy:
    dest: "{{ rke2_server_service_dir }}/{{ rke2_server_service_env_config }}"
    content: |
      {{ rke2_proxy_config }}
    force: false
  when: rke2_configure_proxy|bool

- name: Create registry config
  ansible.builtin.include_tasks: configure-registries.yaml
  when: rke2_registry_configs is defined or rke2_registry_mirrors is defined

- name: Create manifest dir
  ansible.builtin.file:
    path: "{{ rke2_additional_manifests_path }}"
    state: directory
    owner: "{{ rke2_user_name }}"
    group: "{{ rke2_user_group }}"
    mode: 0755
  tags: rke2_config

- name: Create helmchart config
  ansible.builtin.template:
    src: "{{ helm_template }}"
    dest: "{{ rke2_additional_manifests_path }}/{{ item.value.name }}.yaml"
  tags: rke2_config
  loop: "{{ lookup('dict', helmChartConfig, wantlist=True) }}"
  when: helmChartConfig is defined and helmChartConfig | length > 0
  loop_control:
    label: "{{ item.key }}"

- name: Configure NetworkManager
  block:
    - name: Create rke2 config
      ansible.builtin.template:
        src: rke2-canal.conf.j2
        dest: "{{ network_manager_config_dir }}/rke2-canal.conf"
      tags: rke2_config

    - name: Restart service
      ansible.builtin.systemd:
        state: restarted
        daemon_reload: yes
        name: NetworkManager
      tags: rke2_config

    - name: Disable service nm-cloud-setup
      ansible.builtin.systemd:
        name: nm-cloud-setup.service
        enabled: no
        state: stopped
      when: ansible_facts.services["nm-cloud-setup.service"] is defined

    - name: Disable nm-cloud-setup.timer unit
      ansible.builtin.systemd:
        name: nm-cloud-setup.timer
        state: stopped
        enabled: no
      when: ansible_facts.services["nm-cloud-setup.service"] is defined
  when: ansible_os_family == 'RedHat'
