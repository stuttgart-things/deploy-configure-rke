---
- name: Download cilium binary
  block:
    - ansible.builtin.set_fact: bin="{{ cilium_binary|combine(cilium_binary) }}"
    - ansible.builtin.include_role:
        name: download-install-binary

# Air-gapped/edge: fetch the Cilium images tar from an HTTPS source and import it
# into containerd before the install/upgrade, so the agent (DaemonSet, hence every
# node), operator and envoy pods start from the local store. Runs on all hosts, not
# just the master. Pair with cilium_image_pull_policy: Never in cilium-config.yaml.j2
# to forbid any pull attempt.
- name: Pre-load Cilium images from tar
  become: true
  block:
    - name: Create Cilium air-gapped image dir
      ansible.builtin.file:
        path: "{{ cilium_airgapped_install_dir }}"
        state: directory
        mode: "0755"

    - name: Download Cilium images tar
      ansible.builtin.get_url:
        url: "{{ cilium_airgapped_image_url }}"
        dest: "{{ cilium_airgapped_archive_path }}"
        mode: "0644"
        validate_certs: "{{ validate_certs }}"
        checksum: "{{ cilium_airgapped_checksum | default(omit) }}"

    - name: Import Cilium images into containerd
      ansible.builtin.command: >
        {{ cilium_ctr_cmd }} -a {{ rke2_containerd_sock }} -n k8s.io
        images import --digests {{ cilium_airgapped_archive_path }}
      register: cilium_image_import
      # ctr's import wording varies by tar format: `ctr images export` archives
      # (what hack/export-cilium-images.sh produces) report "saved"; docker-save
      # archives report "unpacking"/"unpacked". Match all so a real import isn't
      # misreported as unchanged.
      changed_when: >-
        cilium_image_import.rc == 0 and
        ('saved' in cilium_image_import.stdout
         or 'unpack' in cilium_image_import.stdout)
  when: cilium_airgapped_images | bool

# Run cilium ops only against a stable apiserver. k3s has just started here, so
# the API can still be flapping; installing/upgrading cilium against it can be
# interrupted mid-operation and leave the Helm release stuck in pending-upgrade.
- name: Wait for k8s apiserver to be ready before cilium
  ansible.builtin.command: kubectl get --raw=/readyz
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cilium_api_readyz
  until: cilium_api_readyz.rc == 0
  retries: "{{ cilium_api_ready_retries | default(30) }}"
  delay: "{{ cilium_api_ready_delay | default(10) }}"
  changed_when: false
  when: inventory_hostname in groups['initial_master_node']

# Gateway API CRDs are applied server-side (Cilium 1.20 / Gateway API v1.6 docs)
# with a dedicated field manager. --force-conflicts takes over the fields that an
# older role version applied client-side, so v1.4.1 -> v1.6.1 upgrades in place.
# `kubectl apply --server-side` prints "serverside-applied" for every object even
# when nothing changes, so a server-side diff decides whether to apply at all:
# rc 0 = in sync (skip, ok), rc 1 = differs (apply, changed), rc >1 = diff could
# not run (apply anyway rather than fail).
- name: Install Gateway API CRDs
  vars:
    gateway_api_crds_url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ cilium_gateway_api_crds_version }}/standard-install.yaml"
    gateway_api_ssa_flags: >-
      --server-side --force-conflicts
      --field-manager={{ cilium_gateway_api_crds_field_manager }}
  when:
    - cilium_enable_gateway_api | bool
    - inventory_hostname in groups['initial_master_node']
  block:
    - name: Diff Gateway API CRDs against the cluster
      ansible.builtin.command: >
        kubectl diff {{ gateway_api_ssa_flags }} -f {{ gateway_api_crds_url }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: gateway_api_crds_diff
      failed_when: false
      changed_when: false

    - name: Apply Gateway API CRDs (server-side)
      ansible.builtin.command: >
        kubectl apply {{ gateway_api_ssa_flags }} -f {{ gateway_api_crds_url }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: gateway_api_crds_result
      changed_when: true
      when: gateway_api_crds_diff.rc != 0

- name: Create cilium config
  ansible.builtin.template:
    src: cilium-config.yaml.j2
    dest: "{{ config_dir }}/{{ cilium_config }}"
  tags: cilium_config

# Detect an existing install by its Helm release (cilium-cli installs release
# "cilium" in kube-system on k3s and on RKE2 with rke2_cni: none), not by
# `cilium status` rc. Status is a health probe: it exits 1 both when Cilium is
# absent and when the API is unreachable (failed_when: false then picked the
# install branch, and `cilium install` on an existing release fails with "cannot
# reuse a name that is still in use"). This check is exact, and if the API is
# unreachable it fails the task instead of choosing a branch.
- name: Check if cilium is already installed
  ansible.builtin.command: >
    kubectl -n kube-system get secret
    -l owner=helm,name=cilium -o name
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cilium_release
  changed_when: false
  when: inventory_hostname in groups['initial_master_node']

# cilium_chart_version pins the Cilium release independently of the cilium-cli
# build. Empty -> no --version, i.e. the CLI's built-in default (unchanged).
- name: Set cilium version flag
  ansible.builtin.set_fact:
    cilium_version_flag: >-
      {{ ('--version ' ~ (cilium_chart_version | string | trim))
         if (cilium_chart_version | default('', true) | string | trim | length > 0)
         else '' }}

- name: Install cilium
  ansible.builtin.shell: |
    set -e
    cilium install \
      {{ cilium_version_flag }} \
      --set k8sServiceHost={{ cilium_api_server_ip }} \
      --set k8sServicePort={{ cilium_api_server_port }} \
      --set kubeProxyReplacement={{ cilium_kube_proxy_replacement }} \
      --set ipam.operator.clusterPoolIPv4PodCIDRList='{{ "{" }}{{ cilium_cluster_pool_ipv4_cidr }}{{ "}" }}' \
      --set ipam.operator.clusterPoolIPv4MaskSize={{ cilium_cluster_pool_ipv4_mask_size }} \
      --helm-set=operator.replicas={{ cilium_operator_replicas }}
    cilium status --wait
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  when:
    - inventory_hostname in groups['initial_master_node']
    - cilium_release.stdout | trim | length == 0

- name: Upgrade cilium configuration
  ansible.builtin.shell: |
    set -e
    cilium upgrade {{ cilium_version_flag }} -f {{ config_dir }}/{{ cilium_config }}
    cilium status --wait
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cilium_upgrade
  # `cilium install` replaces kube-proxy and reconfigures the datapath, which can
  # briefly drop the apiserver connection (connection refused / unexpected EOF).
  # Retry so the upgrade rides through that transition instead of failing the run.
  until: cilium_upgrade.rc == 0
  retries: "{{ cilium_upgrade_retries | default(10) }}"
  delay: "{{ cilium_upgrade_delay | default(15) }}"
  changed_when: cilium_upgrade.rc == 0
  when: inventory_hostname in groups['initial_master_node']
