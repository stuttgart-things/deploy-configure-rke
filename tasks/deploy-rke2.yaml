---
- name: Install required packages
  ansible.builtin.include_role:
    name: install-requirements
  vars:
    os_packages: "{{ rke2_os_packages }}"

- name: Download and install addons
  ansible.builtin.include_tasks: install-addons.yaml

- name: Install rke2-server service and the rke2 binary
  ansible.builtin.shell: |
    curl -sfL {{ rke_installscript_url }} | sh -
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_CHANNEL_URL: "{{ rke2_channel_url }}"
    INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
    INSTALL_RKE2_METHOD: "{{ rke2_method }}"

- name: Deploy inital master node
  ansible.builtin.include_tasks: start-rke2.yaml
  when: inventory_hostname in groups['initial_master_node']

- name: Get generated rke2 token for all additional nodes
  block:
    - name: Read rke2 token from inital master
      ansible.builtin.shell: cat {{ rke2_path_to_generated_token }}
      register: rke2_token

    - name: Set rke2 token from inital master
      ansible.builtin.set_fact:
        rke2_shared_token: "{{ rke2_token.stdout }}"
      run_once: true
  when: inventory_hostname in groups['initial_master_node'] and rke2_shared_token is not defined and cluster_setup != 'singlenode'

- name: Deploy additional master nodes
  ansible.builtin.include_tasks: start-rke2.yaml
  when: inventory_hostname in groups['additional_master_nodes'] or inventory_hostname in groups['workers'] and cluster_setup != 'singlenode'

# Label this worker by the name rke2 registers it under (the OS hostname,
# lowercased; the role sets no node-name). The worker joins asynchronously
# after its service starts, so wait for the node object first. kubectl runs on
# the initial master, which holds the admin kubeconfig.
- name: Label worker node
  when: inventory_hostname in groups['workers'] and cluster_setup != 'singlenode'
  block:
    - name: Set worker node name
      ansible.builtin.set_fact:
        rke2_worker_node_name_resolved: "{{ (rke2_worker_node_name | default(ansible_nodename)) | lower }}"

    - name: Wait for the worker node to register
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ rke2_kubeconfig_path }}
        get node {{ rke2_worker_node_name_resolved }} -o name
      register: rke2_worker_node
      retries: "{{ rke2_ready_retries }}"
      delay: "{{ rke2_ready_delay }}"
      until: rke2_worker_node.rc == 0
      changed_when: false
      delegate_to: "{{ groups['initial_master_node'] | first }}"

    - name: Label worker node with the worker role
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ rke2_kubeconfig_path }}
        label node {{ rke2_worker_node_name_resolved }}
        node-role.kubernetes.io/worker=worker --overwrite
      register: rke2_worker_label
      changed_when: "'not labeled' not in rke2_worker_label.stdout"
      delegate_to: "{{ groups['initial_master_node'] | first }}"

- name: Add alias for crictl to nodes
  lineinfile:
    path: ~/.bashrc
    line: "alias crictl='sudo {{ rke2_bin_dir }}/crictl -r {{ rke2_containerd_sock }}'"
  when: add_crictl_alias|bool
